name: Student baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: make test
      - run: make p01-test
      - run: make p02-test
      - run: make up
      - run: make verify
      - if: always()
        run: make down
  tag-p03-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release student checkpoint p03'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag audited P03 release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/checkpoint-p03' \
            -f sha="$GITHUB_SHA"

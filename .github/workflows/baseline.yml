name: Student baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: make test
      - run: make p01-test
      - run: make p02-test
      - run: make up
      - run: make verify
      - run: make down
      - run: make p03-up
      - run: make p03-verify
      - run: make p03-down
      - run: make p04-test
      - run: make p04-up
      - run: make verify
      - run: make p04-verify
      - run: make p04-down
      - run: cmp services/orders/src/main/proto/shipping.proto services/shipping/src/main/proto/shipping.proto
      - run: make p05-up
      - run: make verify
      - name: P05 starter smoke (expected TODOs)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080/api
          curl -fsS "$base/shipping/quote?destination=ES&weightGrams=500" | python3 -c 'import json,sys; assert json.load(sys.stdin)["priceCents"]==499'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/notifications/training/webhooks/delivery" -H 'Content-Type: application/json' -d '{"eventId":"ci-p05","type":"shipping.delivered","orderId":"order-01"}')" = 501
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/orders/training/grpc/quote")" = 501
      - if: always()
        run: make p05-down
      - if: always()
        run: make p04-down
      - if: always()
        run: make p03-down
      - if: always()
        run: make down
  tag-p05-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release student checkpoint p05'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag audited P05 release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/checkpoint-p05' \
            -f sha="$GITHUB_SHA"

name: Student baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: make test
      - run: make p01-test
      - run: make p02-test
      - run: make up
      - run: make verify
      - run: make down
      - run: make p03-up
      - run: make p03-verify
      - run: make p03-down
      - run: make p04-test
      - run: make p04-up
      - run: make verify
      - run: make p04-verify
      - run: make p04-down
      - run: cmp services/orders/src/main/proto/shipping.proto services/shipping/src/main/proto/shipping.proto
      - run: make p05-up
      - run: make verify
      - run: make p05-verify
      - name: Validate P06 starter files
        run: |
          for script in scripts/p06-{render,sample,linkerd-prepare,tools}.sh; do bash -n "$script"; done
          grep -q TODO-select-inventory labs/p06-mesh/service.yaml
          grep -q TODO-v1 labs/p06-mesh/istio.yaml
          grep -q TODO labs/p06-mesh/linkerd-route.yaml
          test -f labs/p06-mesh/workloads.yaml
          test -f labs/p06-mesh/version-services.yaml
      - if: always()
        run: make p05-down
      - if: always()
        run: make p04-down
      - if: always()
        run: make p03-down
      - if: always()
        run: make down
  tag-p06-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release student checkpoint p06'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag audited P06 release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/checkpoint-p06' \
            -f sha="$GITHUB_SHA"
